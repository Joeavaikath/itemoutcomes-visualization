<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Animated walkthrough of Velero backup item outcomes: capture, parentage, volume folding, and finalize."
    />
    <title>Item Outcomes — Backup Lifecycle</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1220'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='%2338bdf8' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">IO</div>
        <div>
          <h1>Item Outcomes</h1>
          <p>Backup lifecycle, animated</p>
        </div>
      </div>

      <div class="controls" aria-label="Playback controls">
        <button id="play" class="button primary" type="button">Play</button>
        <button id="step" class="button" type="button">Step</button>
        <button id="reset" class="button ghost" type="button">Reset</button>
        <label class="speed">
          <span>Speed</span>
          <select id="speed">
            <option value="2200">0.5×</option>
            <option value="1500" selected>1×</option>
            <option value="1000">1.5×</option>
            <option value="650">2×</option>
          </select>
        </label>
      </div>
    </header>

    <main class="layout">
      <section class="panel sequence-panel">
        <div class="panel-head">
          <div>
            <h2>Server sequence</h2>
            <p class="panel-subtitle">Core backup path, no CLI</p>
          </div>
          <span id="phase-badge" class="badge phase">Prepare</span>
        </div>
        <div id="sequence-scroll" class="sequence-scroll">
          <div id="sequence-stage" class="sequence-stage">
            <div id="participants" class="participants"></div>
            <svg id="sequence-svg" aria-hidden="true"></svg>
          </div>
        </div>
      </section>

      <section class="panel artifact-panel">
        <div class="panel-head">
          <div>
            <h2>Artifact</h2>
            <p class="panel-subtitle">The contract as it evolves</p>
          </div>
          <div class="artifact-head-right">
            <span id="finalized-badge" class="badge muted">provisional</span>
            <div class="tabs" role="tablist" aria-label="Artifact view">
              <button class="tab active" data-view="table" type="button" role="tab" aria-selected="true">Table</button>
              <button class="tab" data-view="json" type="button" role="tab" aria-selected="false">JSON</button>
            </div>
          </div>
        </div>

        <div id="volume-info" class="volume-card hidden"></div>
        <div id="artifact-view" class="artifact-view"></div>
      </section>
    </main>

    <footer class="timeline">
      <div class="narration-row">
        <span id="step-counter" class="step-counter">1 / 14</span>
        <p id="narration" class="narration">Press Play or Step to follow the backup lifecycle.</p>
      </div>

      <div class="timeline-track">
        <div id="phase-marks" class="phase-marks"></div>
        <input id="scrubber" type="range" min="0" max="0" value="0" step="1" aria-label="Storyboard position" />
      </div>
    </footer>

    <script src="data/storyboard.js"></script>
    <script src="app.js"></script>
  </body>
</html>
